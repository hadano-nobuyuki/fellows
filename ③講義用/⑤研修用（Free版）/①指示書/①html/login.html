<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン | ClaudeCode 研修用プログラム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!--
  画面名 : ログイン画面
  遷移先 : 認証成功 → 商品一覧画面(product_list.html)
           認証失敗 → この画面にエラーメッセージを表示
-->
<main class="login-page">
  <div class="login-card">
    <img class="logo" src="logo.svg" alt="ロゴ">
    <p class="app-name">ClaudeCode 研修用プログラム</p>
    <h1>ログイン画面</h1>

    <!-- エラーメッセージ:認証失敗時のみ表示する(サーブレットから受け取る) -->
    <p class="error-message">ユーザ名またはパスワードが正しくありません。</p>

    <form method="post" action="login">
      <div class="field">
        <label for="username">ユーザ名</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary">ログイン</button>
    </form>
  </div>
</main>
</body>
</html>
